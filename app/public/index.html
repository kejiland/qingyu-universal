  <!-- 静态 base：彻底解决 /posts/<别名>/ 深度页面刷新时静态资源被按相对目录解析而 404 的问题。
       （此前用 JS 动态插入 base，会与浏览器的预加载扫描器产生竞态，直达子页时仍会 404。） -->
  <base href="/">
  <script>
    // file:// 本地双击直开时，把资源基准改回当前目录，保持本地预览可用；在线部署保持根路径。
    // 同时尽早应用主题，避免深色模式用户首屏白闪（FOUC）。
    (function () {
      if (/^file:/i.test(location.protocol)) {
        var b = document.querySelector('base');
        if (b) b.setAttribute('href', './');
      }
      // iOS 检测（含 iPadOS 13+ 的 MacIntel 伪装）：命中后打 .ios 类，
      // style.css 据此用系统原生宋体/仿宋、跳过 CDN webfont（省流量）。
      var _plat = navigator.platform || '';
      var _ua = navigator.userAgent || '';
      if (/iP(hone|ad|od)/.test(_plat) || (/MacIntel/.test(_plat) && navigator.maxTouchPoints > 1) || /iPad|iPhone|iPod/.test(_ua)) {
        document.documentElement.classList.add('ios');
      }
      try {
        var t = localStorage.getItem('qingyu.theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        // 主题色（accent）：缺省 terra = 默认赭橙配色；提前设置避免切色后首屏闪动
        var a = localStorage.getItem('qingyu.accent');
        if (['terra', 'indigo', 'bamboo', 'dusk'].indexOf(a) >= 0) {
          document.documentElement.setAttribute('data-accent', a);
        }
      } catch (e) {}

      // 正文字号（阅读缩放）：与主题 / 主题色一样在首屏前应用。
      // 否则 SSR 出来的正文先用默认字号渲染，app.js 接管后才跳到用户设置的值。
      // 键名与 app.js 的 READING_SCALE_KEY 一致，取值区间也对齐（0.85~1.5）。
      try {
        var rs = Number(localStorage.getItem('qingyu.readingScale'));
        if (rs >= 0.85 && rs <= 1.5) {
          document.documentElement.style.setProperty('--reading-scale', String(rs));
        }
      } catch (e) {}
      /* 字号按钮的**首屏兜底**：SSR（src/ssr/post.ts）直接把 A-/A/A+ 渲染进
       * 静态 HTML，而事件绑定在 app.js 里 —— 它要等到空闲或用户交互才加载
       * （boot.js 的渐进增强），这之前按钮是死的，点了没反应。
       * 这里用 document 级**捕获**委托让按钮首屏即可用；捕获阶段先于按钮上的
       * handler，处理完 stopPropagation，避免 app.js 接管后两边各加一次 0.1。
       * 逻辑与 app.js 的 setReadingScale 完全对齐（同键名、同 0.85~1.5 区间）。 */
      document.addEventListener('click', function (e) {
        var btn = e.target && e.target.closest ? e.target.closest('[data-rs]') : null;
        if (!btn) return;
        e.stopPropagation();
        e.preventDefault();
        var step = Number(btn.getAttribute('data-rs'));
        var cur = 1;
        try { cur = Number(localStorage.getItem('qingyu.readingScale')) || 1; } catch (err) {}
        if (!(cur >= 0.85 && cur <= 1.5)) cur = 1;
        var next = step === 0 ? 1 : Math.round((cur + step * 0.1) * 100) / 100;
        next = Math.max(0.85, Math.min(1.5, next));
        next = Math.round(next * 100) / 100;
        try {
          localStorage.setItem('qingyu.readingScale', String(next));
          document.documentElement.style.setProperty('--reading-scale', String(next));
        } catch (err) {}
      }, true);
    })();
  </script>

  <style>
    /* 首屏加载动画：在 app.js 接管前显示，主题色与暖色调一致 */
    .mp-root { display: none; }
    .boot-load {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: var(--bg, #faf7f2); z-index: 1000;
    }
    .boot-ring {
      width: 36px; height: 36px; position: relative;
    }
    .boot-ring::before, .boot-ring::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid transparent; border-top-color: var(--accent, #a55031);
      animation: bootSpin 1s cubic-bezier(.5,.15,.75,.45) infinite;
    }
    .boot-ring::after { animation-delay: .15s; border-top-color: var(--accent-2, #e28a56); opacity: .7; }
    .boot-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #cfc4b6;
      animation: bootPulse 1.2s ease-in-out infinite;
    }
    .boot-name { font-size: 13.5px; color: #9b8f83; letter-spacing: 3px; }
    @keyframes bootSpin { to { transform: rotate(360deg); } }
    @keyframes bootPulse { 0%,100% { opacity:.3; transform: scale(.8); } 50% { opacity:1; transform: scale(1.15); } }
    @media (prefers-color-scheme: dark) {
      .boot-load { background: #1d1a17; }
      .boot-dot { background: #6a6158; }
      .boot-name { color: #a89b8e; }
    }
  </style>
  <!-- 首屏关键资源预加载：defer 脚本虽会被预加载扫描器发现，但显式 preload 可让浏览器
       更早发起请求，弱网/高延迟下少等一个往返。同一 URL 只会下载一次。 -->
  <link rel="preload" href="config.min.js?v=b5ff3537c" as="script">
  <link rel="preload" href="posts.min.js?v=b5ff3537c" as="script">
  <link rel="preload" href="i18n.min.js?v=b5ff3537c" as="script">
  <link rel="preload" href="app.min.js?v=b5ff3537c" as="script">
  <link rel="preload" href="style.min.css?v=b5ff3537c" as="style">
  <link rel="preload" as="style" href="style.min.css?v=b5ff3537c">
  <link id="global-style" rel="stylesheet" href="style.min.css?v=b5ff3537c">
  <link rel="stylesheet" href="polish.min.css?v=b5ff3537c">
  <noscript><link rel="stylesheet" href="style.min.css?v=b5ff3537c"></noscript>
  <!-- 字体策略：前台全部改走系统宋体/仿宋栈，不再加载任何 webfont，PageSpeed 网络负载大幅下降 -->
  <script defer src="config.min.js?v=b5ff3537c"></script>
  <script defer src="posts.min.js?v=b5ff3537c"></script>
  <script defer src="i18n.min.js?v=b5ff3537c"></script>
</head>
<body>
  <div id="app">
    <div class="boot-load" id="bootLoad">
      <div class="boot-ring"></div>
      <div class="boot-dot"></div>
      <div class="boot-name">Qingyu'Blog · 加载中</div>
    </div>
  </div>
  <script defer src="boot.min.js?v=b5ff3537c"></script>
  <script>
  /* 阅读字号（A− / A / A+）提前生效
   * ------------------------------------------------------------
   * SSR 文章页已经渲染出「字号」工具条，但绑定事件的 app.min.js 是延迟加载的
   * （boot.js 等首次交互或空闲）。手机端用户点 A+ 的那一下正好被用来触发
   * app.min.js 加载 —— 事件处理器此时还不存在，于是「第一次点没反应」，
   * 看起来就是字号功能失效。
   *
   * 这里用一份极小的早期实现接管：事件委托挂在 document 上；app.min.js
   * 接管后会重绘整个工具条并自行绑定，两者不会双重生效。
   * 同时首屏立刻应用已保存的字号，避免 SSR 页面先按 100% 渲染再跳一下。
   */
  (function () {
    var KEY = 'qingyu.readingScale';
    function get() {
      var v = 1;
      try { v = Number(localStorage.getItem(KEY)) || 1; } catch (e) {}
      if (!(v >= 0.85 && v <= 1.5)) v = 1;
      return Math.round(v * 100) / 100;
    }
    function apply(v) {
      v = Math.max(0.85, Math.min(1.5, Number(v) || 1));
      v = Math.round(v * 100) / 100;
      try { document.documentElement.style.setProperty('--reading-scale', String(v)); } catch (e) {}
      try { localStorage.setItem(KEY, String(v)); } catch (e) {}
      return v;
    }
    // 首屏立即应用，避免正文先以 100% 渲染再突然变大/变小
    apply(get());

    function toast(text) {
      var wrap = document.querySelector('.toast-wrap');
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.className = 'toast-wrap';
        document.body.appendChild(wrap);
      }
      var el = document.createElement('div');
      el.className = 'toast-item toast-ok';
      el.textContent = text;
      wrap.appendChild(el);
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1600);
    }
    function label() {
      var el = document.querySelector('.rt-label');
      return el ? String(el.textContent || '').trim() : '字号';
    }
    document.addEventListener('click', function (e) {
      var b = e.target && e.target.closest ? e.target.closest('[data-rs]') : null;
      if (!b) return;
      var step = Number(b.getAttribute('data-rs'));
      if (!step && step !== 0) return;
      // app.min.js 已接管时交给它自己处理，避免双重生效
      if (window.__readingScaleBound) return;
      // 在捕获阶段统一处理并阻断后续监听（含 app.js 绑在按钮上的处理器），
      // 否则同一次点击会被处理两遍，字号一次连跳两格。
      e.preventDefault();
      e.stopPropagation();
      var v = apply(step === 0 ? 1 : (get() + step * 0.1));
      toast(label() + ' ' + Math.round(v * 100) + '%');
    }, true);
  })();
  </script>
  <script>
  /* 外链图挂死看门狗：图床 DNS 失败 / 代理挂死时，浏览器可能十几秒都不报
   * error，load 事件被拖住（实测 12.5s）。对 4 秒内仍没加载完的外链 eager 图
   * 直接移除：渐变占位顶上，load 事件尽快触发。同源图与懒加载图不设看门狗。
   * app.js 接管重建 DOM 后，用 MutationObserver 把新插入的图也看住。 */
  (function () {
    function watch(img) {
      var src = img.getAttribute('src') || '';
      if (!/^https?:/i.test(src)) return;
      if ((img.getAttribute('loading') || '').toLowerCase() === 'lazy') return;
      try { if (new URL(src, location.href).host === location.host) return; } catch (e) {}
      var t = setTimeout(function () { if (!img.complete) img.remove(); }, 4000);
      img.addEventListener('load', function () { clearTimeout(t); }, { once: true });
      img.addEventListener('error', function () { clearTimeout(t); }, { once: true });
    }
    function scan(root) {
      var imgs = (root || document).querySelectorAll('img');
      for (var i = 0; i < imgs.length; i++) {
        if (!imgs[i].getAttribute('data-watched')) { imgs[i].setAttribute('data-watched', '1'); watch(imgs[i]); }
      }
    }
    function boot() {
      scan();
      if ('MutationObserver' in window) {
        new MutationObserver(function (muts) {
          for (var i = 0; i < muts.length; i++) {
            var n = muts[i].addedNodes;
            for (var j = 0; j < n.length; j++) {
              if (n[j].nodeType !== 1) continue;
              if (n[j].tagName === 'IMG') { n[j].setAttribute('data-watched', '1'); watch(n[j]); }
              else if (n[j].querySelectorAll) scan(n[j]);
            }
          }
        }).observe(document.body, { childList: true, subtree: true });
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
    else boot();
  })();
  </script>
  <script>
  // 首屏兜底：网络很卡时核心脚本可能迟迟不来，页面会一直停在「加载中」转圈，
  // 看起来像站点坏了。8 秒仍未完成首次渲染就提示「网络较慢」并给出重新加载按钮。
  // app.js 渲染完成会置 window.__qingyuBooted 并整体重写 #app，提示随之自动消失。
  (function () {
    function showSlowTip() {
      if (window.__qingyuBooted) return;
      var boot = document.getElementById('bootLoad');
      if (!boot || document.getElementById('bootSlowTip')) return;
      var tip = document.createElement('div');
      tip.id = 'bootSlowTip';
      tip.style.cssText = 'margin-top:18px;text-align:center;font-size:12.5px;color:#a2958a;line-height:2';
      var msg = document.createElement('div');
      msg.textContent = '网络较慢，页面还在加载…';
      tip.appendChild(msg);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.style.cssText = 'margin-top:6px;padding:6px 18px;border:1px solid #d8cec3;border-radius:6px;background:#fff;color:#8a7d70;font-size:12.5px;cursor:pointer';
      btn.textContent = '重新加载';
      btn.addEventListener('click', function () { location.reload(); });
      tip.appendChild(btn);
      boot.appendChild(tip);
    }
    setTimeout(showSlowTip, 8000);
    // 30s 还没救回来：把提示换成更明确的一句话，别让用户干等
    setTimeout(function () {
      var tip = document.getElementById('bootSlowTip');
      if (tip && !window.__qingyuBooted) {
        tip.innerHTML = '<div>网络连接不稳定，页面没能加载出来</div>';
        tip.appendChild(btn2());
      }
    }, 30000);
    function btn2() {
      var b = document.createElement('button');
      b.type = 'button';
      b.style.cssText = 'margin-top:6px;padding:6px 18px;border:1px solid #d8cec3;border-radius:6px;background:#fff;color:#8a7d70;font-size:12.5px;cursor:pointer';
      b.textContent = '重新加载';
      b.addEventListener('click', function () { location.reload(); });
      return b;
    }
  })();
  </script>
  <script>
  // 非首屏脚本改为「空闲/按需」加载：先保证首页渲染与核心交互，
  // 再在浏览器空闲时拉取播放器与背景动画；触屏设备默认不预载背景动画。
  (function () {
    function loadJs(src) {
      var s = document.createElement('script');
      s.src = src + '?v=b5ff3537c';
      s.defer = true;
      document.body.appendChild(s);
      return s;
    }
    function loadCss(href) {
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href + '?v=b5ff3537c';
      document.head.appendChild(l);
      return l;
    }
    function idle(fn) {
      try {
        if ('requestIdleCallback' in window) { requestIdleCallback(fn, { timeout: 2500 }); return; }
      } catch (e) {}
      setTimeout(fn, 1600);
    }
    var isTouch = false;
    try { isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0; } catch (e) {}
    if (!isTouch) {
      idle(function () { loadJs('bg-anim.min.js'); });
    }
    var p = '';
    try { p = location.pathname || ''; } catch (e) {}
    if (p.indexOf('/admin') !== 0 && p !== '/write' && !/^\/posts\/[^/]+\/(edit)$/.test(p)) {
      idle(function () { loadCss('music-player.min.css'); loadJs('music-player.min.js'); });
    }
  })();
  </script>
  <!-- 后台脚本按需加载：仅进入后台路由时由 app.js 懒加载 -->
  <script>
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js?v=b5ff3537c').catch(function () {});
    });
  }
  </script>
