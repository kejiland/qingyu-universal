# ============================================================
# 镜像发布流水线
# ------------------------------------------------------------
# 触发时机：
#   · push 到 main  → 构建并推送 latest（附带 main / sha-<短哈希> 标签）
#   · 推送 v* tag   → 额外产出 semver 标签（X.Y.Z / X.Y）并创建 GitHub Release
#   · 手动触发      → 与 main 分支同行为，随时重跑 / 补发
# 为什么每次提交都重发：预构建镜像是小内存机器（1G VPS）唯一省内存的装法，
# 镜像落后于代码，就等于那些机器拿不到新版本。
# ============================================================
name: Image & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # 手动运行：Actions 页面点 Run workflow，随时重发 latest
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  # 连续推送时取消上一次还没跑完的发布，避免旧镜像覆盖新镜像
  group: image-release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: 多架构镜像、SBOM 与签名
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: qingyu-universal.spdx.json
          artifact-name: qingyu-universal-spdx
          # sbom-action 默认自己也上传一份，与下面 upload-artifact 同名，v4 冲突会让流水线收尾失败
          upload-artifact: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingyu-universal-spdx
          path: qingyu-universal.spdx.json

      # 只有推 tag 才算「发布」，建 GitHub Release；main 推送不建，免得刷出一堆 release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: qingyu-universal.spdx.json