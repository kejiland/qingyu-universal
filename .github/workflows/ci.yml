name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: 端到端冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 准备配置
        run: |
          cat > .env <<'EOF'
          PORT=8787
          HOST=127.0.0.1
          SITE_URL=http://localhost:8787
          DATA_DIR=./data
          TRUST_PROXY=0
          BLOG_ADMIN_SETUP_KEY=ci-setup-key
          EOF

      - name: 应用数据库迁移
        run: node server/migrate.js

      - name: 启动服务
        run: |
          node server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8787/healthz && break
            sleep 1
          done

      - name: 冒烟测试
        env:
          BASE_URL: http://localhost:8787
          SETUP_KEY: ci-setup-key
        run: node scripts/smoke.mjs

      - name: 失败时输出服务日志
        if: failure()
        run: cat server.log

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: qingyu-universal:ci
      - name: 容器冒烟测试
        run: |
          docker run -d --name qingyu-ci \
            -e SITE_URL=http://localhost:8787 \
            -e BLOG_ADMIN_SETUP_KEY=ci-setup-key \
            -p 8787:8787 qingyu-universal:ci
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8787/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8787/api/posts | head -c 200
          docker logs qingyu-ci --tail 40

  syntax:
    name: 脚本语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash 语法检查
        run: bash -n deploy/install.sh
      - name: 所有模块可被 Node 解析
        run: |
          node --input-type=module -e "await import('./server/config.js')"
          node --check scripts/backup.js
          node --check scripts/restore.js
          node --check scripts/health.js
          node --check scripts/seed.js