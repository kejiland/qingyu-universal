name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '24'
  SETUP_KEY: ci-setup-key

jobs:
  quality:
    name: 类型检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 单元测试与契约测试
        run: npm test

      - name: 测试代码类型检查
        run: npm run typecheck:tests

      - name: 生成 OpenAPI 与客户端类型
        run: npm run api:generate

      - name: 检查生成产物是否最新
        run: |
          if ! git diff --quiet generated/; then
            echo "::error::generated/ 与 API 契约不一致。请在本地运行 npm run api:generate 并提交产物。"
            git --no-pager diff --stat generated/
            exit 1
          fi

      - name: 安装后台依赖
        run: npm run admin:install

      - name: 后台类型检查与构建
        run: npm run admin:build

      - name: 界面对比度自检
        run: npm run check:contrast

      - name: bash 语法检查
        run: bash -n deploy/install.sh

  smoke:
    name: 端到端冒烟测试
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: 准备配置
        run: |
          cat > .env <<EOF
          PORT=8787
          HOST=127.0.0.1
          SITE_URL=http://localhost:8787
          DATA_DIR=./data
          TRUST_PROXY=0
          LOG_PRETTY=0
          BLOG_ADMIN_SETUP_KEY=${{ env.SETUP_KEY }}
          EOF

      - name: 应用数据库迁移
        run: npm run migrate

      - name: 启动服务
        run: |
          node dist/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8787/healthz && break
            sleep 1
          done

      - name: 冒烟测试
        env:
          BASE_URL: http://localhost:8787
        run: npm run smoke

      - name: 失败时输出服务日志
        if: failure()
        run: cat server.log

  docker:
    name: 镜像构建与容器验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: qingyu-universal:ci

      - name: 容器冒烟测试
        run: |
          docker run -d --name qingyu-ci \
            -e SITE_URL=http://localhost:8787 \
            -e LOG_PRETTY=0 \
            -e BLOG_ADMIN_SETUP_KEY=${{ env.SETUP_KEY }} \
            -p 8787:8787 qingyu-universal:ci

          # 等待容器就绪（最多 40 秒），失败时把容器日志打出来方便定位
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8787/healthz; then
              echo
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::容器 40 秒内未通过健康检查，详见下方容器日志"
            docker logs qingyu-ci --tail 80
            exit 1
          fi

          # 冒烟脚本就在镜像里（宿主机只 checkout 源码、没有 dist/ 构建产物），
          # 所以必须在容器内执行；这也是之前该步骤一直失败的原因。
          if ! docker exec \
            -e BASE_URL=http://localhost:8787 \
            -e SETUP_KEY=${{ env.SETUP_KEY }} \
            qingyu-ci node dist/cli/smoke.js; then
            echo "::error::容器冒烟测试未通过，详见下方容器日志"
            docker logs qingyu-ci --tail 80
            exit 1
          fi

          docker logs qingyu-ci --tail 40

  install-smoke:
    name: 干净 Debian 一键安装验收
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      # 关键：容器里什么都没有（无 curl / git / Docker），全靠 install.sh 自己检测安装。
      # 挂宿主 Docker socket —— 脚本装出来的 CLI 直接用宿主守护进程构建和跑容器；
      # --network host 让脚本在容器内也能访问到应用发布出来的端口做健康检查。
      - name: 起一个「什么都没有」的 Debian
        run: |
          docker run -d --name debian-clean --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/src:ro \
            debian:bookworm-slim sleep infinity
          # 最小镜像缺 tar / iproute2，先补齐脚本一定会用到的基础件
          docker exec debian-clean bash -c '
            set -eux
            apt-get update -qq
            apt-get install -y -qq ca-certificates procps iproute2 tar gzip
          '

      - name: 一键安装（curl / git / Docker 全部由脚本自动装）
        run: |
          docker exec debian-clean bash -c '
            set -o pipefail
            bash /src/deploy/install.sh --port 8788 -y 2>&1 | tee /tmp/install.log
          '

      - name: 验收：健康检查 + doctor 体检 + 幂等重跑
        run: |
          echo "== 1. 宿主机直连健康检查 =="
          curl -fsS http://127.0.0.1:8788/healthz
          echo

          echo "== 2. 部署信息 =="
          docker exec debian-clean bash /src/deploy/install.sh info | tail -n 20

          echo "== 3. doctor 体检（应全绿或只有公网类提示） =="
          docker exec debian-clean bash /src/deploy/install.sh doctor

          echo "== 4. 幂等重跑：.env 必须原封不动 =="
          docker exec debian-clean bash -c 'sha256sum /opt/qingyu-universal/.env > /tmp/env.sha'
          docker exec debian-clean bash /src/deploy/install.sh --port 8788 -y \
            2>&1 | tail -n 5
          docker exec debian-clean sha256sum -c /tmp/env.sha

      - name: 失败时留下现场
        if: failure()
        run: |
          docker exec debian-clean sh -c "tail -n 120 /tmp/install.log" 2>/dev/null || true
          docker ps -a || true
          docker logs qingyu-app --tail 80 || true

      - name: 清理
        if: always()
        run: docker rm -f debian-clean qingyu-app 2>/dev/null || true

  postgres:
    name: PostgreSQL 真实库集成测试
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: qingyu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qingyu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:test123@127.0.0.1:5432/qingyu_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 跑 PostgreSQL 集成测试
        run: npx vitest run tests/postgres.test.ts
