<!doctype html>
<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>管理后台 · 轻语博客</title>
    <script>
      // 尽早应用明暗与主题色，避免首屏闪白 / 闪一下默认色
      (function () {
        try {
          var saved = localStorage.getItem('qingyu.admin.theme');
          var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
        // 主题色与前台博客共用 localStorage["qingyu.accent"]
        try {
          var accents = ['terra', 'indigo', 'bamboo', 'dusk'];
          var accent = localStorage.getItem('qingyu.accent');
          document.documentElement.setAttribute('data-accent', accents.indexOf(accent) >= 0 ? accent : 'terra');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
