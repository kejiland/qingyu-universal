# ============================================================
# 轻语博客 · 自托管通用版
# ------------------------------------------------------------
# 启动：docker compose up -d
# 日志：docker compose logs -f app
# 停止：docker compose down
#
# 全部配置来自同目录 .env（部署时生成，或从 .env.example 复制）。
# ============================================================
name: qingyu-universal

services:
  app:
    # 默认直接用 GHCR 上 CI 构建好的镜像：拉取约 1~2 分钟，
    # 在服务器上现场 build 要跑 tsc，1G 小机器实测 6~10 分钟还容易 OOM。
    # 需要改代码/自建镜像时用 compose.build.yaml 覆盖（见文件末尾说明）。
    image: ${QINGYU_IMAGE:-ghcr.io/kejiland/qingyu-universal:latest}
    container_name: qingyu-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内必须监听 0.0.0.0，由 Caddy 反代
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      # 有反代（Caddy/Nginx）才设 1；**无域名、直连暴露（APP_BIND=0.0.0.0:8080）必须设 0**，
      # 否则客户端伪造 X-Forwarded-For 就能绕过登录失败锁定、评论频控、点赞去重。
      # 详见 README「部署」一节。
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      # 域名管理只通过 Compose 内网的 domain-agent 执行；主应用不持有 Docker socket。
      DOMAIN_AGENT_URL: http://domain-agent:8790
      DOMAIN_AGENT_TOKEN: "${DOMAIN_AGENT_TOKEN:-}"
    volumes:
      - qingyu-data:/data
    # 两种部署模式共用同一个服务：
    #   有域名 → APP_BIND=127.0.0.1:8787，只有 Caddy 能访问，走自动 HTTPS
    #   无域名 → APP_BIND=0.0.0.0:8080，直接用 http://<IP>:<端口> 访问，不启 Caddy
    ports:
      - "${APP_BIND:-127.0.0.1:8787}:8787"
    networks:
      - qingyu
    # 限制容器日志大小：Docker 默认不轮转，小 VPS 上日志会把磁盘写满。
    # 每容器最多 3×10MB，超出自动丢弃最旧的。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 域名与 HTTPS 管理 Agent：常驻运行（不能放在 domain profile 里，
  # 否则首次从后台启用域名时它自己不存在）。它独占 Docker socket，
  # 串行执行 .env 原子修改、Compose 重建、DNS 与 HTTPS 验证。
  domain-agent:
    image: ${QINGYU_IMAGE:-ghcr.io/kejiland/qingyu-universal:latest}
    container_name: qingyu-domain-agent
    restart: unless-stopped
    user: "0:0"
    command: ["node", "dist/domain-agent/index.js"]
    environment:
      QINGYU_PROJECT_DIR: /project
      QINGYU_ENV_FILE: /project/.env
      # 从容器内调用宿主机 Docker 时，bind mount 必须使用宿主机绝对路径。
      # 留空时 Agent 会通过 docker inspect 反查 /project 的真实来源。
      QINGYU_HOST_PROJECT_DIR: "${QINGYU_HOST_PROJECT_DIR:-}"
      DOMAIN_AGENT_STATE_DIR: /state
      DOMAIN_AGENT_PORT: "8790"
      DOMAIN_AGENT_TOKEN: "${DOMAIN_AGENT_TOKEN:-}"
      QINGYU_PUBLIC_IP: "${QINGYU_PUBLIC_IP:-}"
      APP_PORT: "${PORT:-8787}"
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-qingyu-universal}
      COMPOSE_PROFILES: "${COMPOSE_PROFILES:-}"
    volumes:
      - ${QINGYU_HOST_PROJECT_DIR:-.}:/project
      - domain-agent-state:/state
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - qingyu
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/status',{headers:{Authorization:'Bearer '+process.env.DOMAIN_AGENT_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选内置数据库：仅在 COMPOSE_PROFILES 含 postgres 时启动。
  # 端口只在 qingyu 内网暴露，不映射到宿主机 —— 避免与宿主机已有的
  # PostgreSQL 抢 5432，也少一个被公网扫到的入口。
  postgres:
    image: postgres:17-alpine
    container_name: qingyu-postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qingyu}
      POSTGRES_USER: ${POSTGRES_USER:-qingyu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qingyu-change-me}
      # 数据放到子目录里，官方镜像换大版本时不会误判数据目录
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-qingyu} -d $${POSTGRES_DB:-qingyu}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - qingyu
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: qingyu-redis
    restart: unless-stopped
    profiles:
      - redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - qingyu
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: qingyu-caddy
    restart: unless-stopped
    # 仅在配置了域名时启动（COMPOSE_PROFILES=domain）。
    # 不配域名时应直接用 http://<IP>:<端口> 访问，不需要也不应该经过 Caddy ——
    # 否则 Caddy 会用自签证书强制 HTTPS，浏览器报证书错误。
    profiles:
      - domain
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      # 别名域名（空格分隔），一个站点可以同时用多个域名访问；未配置时为空
      SITE_ALIASES: ${SITE_ALIASES:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${QINGYU_HOST_PROJECT_DIR:-.}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - qingyu
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qingyu-data:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  domain-agent-state:

networks:
  qingyu:
    driver: bridge