# ============================================================
# 轻语博客 · 自托管通用版
# ------------------------------------------------------------
# 启动：docker compose up -d --build
# 日志：docker compose logs -f app
# 停止：docker compose down
#
# 全部配置来自同目录 .env（由 deploy/install.sh 生成，或从 .env.example 复制）。
# ============================================================
name: qingyu-universal

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # 由 install.sh 解析后注入；取不到则为空
        BUILD_REVISION: ${BUILD_REVISION:-}
    image: ${QINGYU_IMAGE:-qingyu-universal:local}
    container_name: qingyu-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内必须监听 0.0.0.0，由 Caddy 反代
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      TRUST_PROXY: "1"
    volumes:
      - qingyu-data:/data
    # 两种部署模式共用同一个服务：
    #   有域名 → APP_BIND=127.0.0.1:8787，只有 Caddy 能访问，走自动 HTTPS
    #   无域名 → APP_BIND=0.0.0.0:8080，直接用 http://<IP>:<端口> 访问，不启 Caddy
    ports:
      - "${APP_BIND:-127.0.0.1:8787}:8787"
    networks:
      - qingyu
    # 限制容器日志大小：Docker 默认不轮转，小 VPS 上日志会把磁盘写满。
    # 每容器最多 3×10MB，超出自动丢弃最旧的。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: qingyu-redis
    restart: unless-stopped
    profiles:
      - redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - qingyu
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: qingyu-caddy
    restart: unless-stopped
    # 仅在配置了域名时启动（COMPOSE_PROFILES=domain）。
    # 不配域名时应直接用 http://<IP>:<端口> 访问，不需要也不应该经过 Caddy ——
    # 否则 Caddy 会用自签证书强制 HTTPS，浏览器报证书错误。
    profiles:
      - domain
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - qingyu
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qingyu-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  qingyu:
    driver: bridge