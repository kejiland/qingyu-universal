# 轻语博客 · Fly.io 模板
# 用法：
#   fly launch --no-deploy --copy-config --config deploy/fly.toml
#   fly volumes create qingyu_data --size 1 --region sin
#   fly secrets set BLOG_ADMIN_SETUP_KEY=... BLOG_WRITE_TOKEN=... SITE_URL=https://你的应用.fly.dev
#   fly deploy --config deploy/fly.toml

app = "qingyu-universal"
primary_region = "sin"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"
  LOG_PRETTY = "0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "qingyu_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"